<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Yandex Mail Personalizer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <h1>Yandex Mail Personalizer</h1>
  </header>

  <section class="card">
    <label class="file-label" for="file-input">
      <span class="file-icon">📄</span>
      <span id="file-name">Выберите .txt файл</span>
      <input type="file" id="file-input" accept=".txt,text/plain">
    </label>
    <div class="muted" id="file-stats"></div>
  </section>

  <section class="card progress" id="progress-section" hidden>
    <div class="progress-row">
      <span>Подготовлено <b id="prepared-count">0</b> из <b id="total-count">0</b></span>
      <span class="muted">Отправлено: <b id="sent-count">0</b></span>
    </div>
    <div class="bar"><div class="bar-fill" id="progress-fill"></div></div>
  </section>

  <section class="status" id="status">Загрузите файл для начала</section>

  <section class="actions">
    <button id="start-btn" disabled>Начать</button>
    <button id="next-btn" hidden>Далее</button>
  </section>

  <section class="error" id="error" hidden></section>

  <footer class="footer muted">
    Письмо отправляется только вручную в интерфейсе Яндекс.Почты.
  </footer>

  <script src="popup.js"></script>
</body>
</html>
